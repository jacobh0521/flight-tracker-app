<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live Flow Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body, html { margin:0; padding:0; height:100%; }
    #map { width:100%; height:90vh; }
    #controls { padding: 10px; }

    .legend {
      background: white;
      line-height: 18px;
      color: #555;
      padding: 6px 8px;
      border-radius: 5px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .legend h4 { margin: 0 0 5px 0; font-size: 14px; }
    .legend-gradient {
      width: 120px;
      height: 12px;
      background: linear-gradient(to right, blue, red);
      margin-bottom: 5px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

<div id="controls">
  <label>Airport ICAO:</label>
  <input id="airportInput" value="{{ airport }}" onkeydown="if(event.key==='Enter') loadFlow(true)" />
  <button onclick="loadFlow(true)">Load</button>
  <a href="/">← Back to Dashboard</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map;
let markers = [];
let headingLines = [];
let pollInterval = null;
const maxVel = 250;

function initMap() {
  const lat = parseFloat("{{ initial_lat }}" || "0");
  const lon = parseFloat("{{ initial_lon }}" || "0");
  map = L.map('map').setView([lat, lon], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  const legend = L.control({ position: 'topright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <h4>Velocity (m/s)</h4>
      <div class="legend-gradient"></div>
      <div style="display:flex;justify-content:space-between;">
        <span>0</span><span>${maxVel}</span>
      </div>`;
    return div;
  };
  legend.addTo(map);
}

function velocityStyle(v) {
  const radius = Math.max(5, Math.min(20, 5 + (v / maxVel) * 15));
  const r = Math.min(255, Math.round((v / maxVel) * 255));
  const b = Math.max(0, 255 - r);
  return { radius, color: `rgb(${r},0,${b})` };
}

function loadFlow(centerMap = false) {
  if (document.hidden) return; // Skip polling if tab is in background

  const airport = document.getElementById("airportInput").value.trim().toUpperCase();

  fetch(`/api/flow?airport=${airport}`)
    .then(res => res.json())
    .then(data => {
      const states = data.states || [];

      markers.forEach(m => map.removeLayer(m));
      headingLines.forEach(l => map.removeLayer(l));
      markers = [];
      headingLines = [];

      if (centerMap && data.center) {
        map.setView([data.center.lat, data.center.lon], 11);
      }

      if (!states.length) return;

      states.forEach(f => {
        if (!f.lat || !f.lon) return;

        const style = velocityStyle(f.velocity || 0);

        const marker = L.circleMarker([f.lat, f.lon], {
          radius: style.radius,
          fillColor: style.color,
          color: "#000",
          weight: 1,
          fillOpacity: 0.7
        }).addTo(map);

        marker.bindPopup(`
          <b>${f.callsign || f.icao24}</b><br>
          Speed: ${Math.round(f.velocity || 0)} m/s
        `);

        markers.push(marker);

        if (typeof f.heading === "number") {
          const len = 0.02;
          const rad = f.heading * Math.PI / 180;
          const endLat = f.lat + len * Math.cos(rad);
          const endLon = f.lon + len * Math.sin(rad);

          const line = L.polyline([[f.lat, f.lon], [endLat, endLon]], {
            color: "black",
            weight: 2
          }).addTo(map);

          headingLines.push(line);
        }
      });
    })
    .catch(err => {
      console.error(err);
    });
}

window.onload = () => {
  initMap();
  loadFlow(true);

  pollInterval = setInterval(() => {
    loadFlow(false);
  }, 30000);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      loadFlow(false);
    }
  });
};
</script>

</body>
</html>
